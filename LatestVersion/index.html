/* =========================================================
   GITHUB LATEST VERSION UPDATER
========================================================= */

const UPDATE_CONFIG = {

    repository:
        "AMoldyWaffle/ChimpanziniKiosk",

    branch:
        "main",

    folder:
        "LatestVersion",

    files: {

        index:
            "index.html",

        kiosk:
            "ChimpanziniKiosk.html"

    }

};


/*
    Raw GitHub base.

    These are the files we download:

        LatestVersion/index.html
        LatestVersion/ChimpanziniKiosk.html
*/
function getUpdateURL(fileName){

    return (
        "https://raw.githubusercontent.com/" +
        UPDATE_CONFIG.repository +
        "/" +
        UPDATE_CONFIG.branch +
        "/" +
        UPDATE_CONFIG.folder +
        "/" +
        fileName +
        "?update=" +
        Date.now()
    );

}


/*
    Read a text file from GitHub.
*/
async function downloadUpdateFile(fileName){

    const url =
        getUpdateURL(fileName);

    const response =
        await fetch(
            url,
            {
                method:"GET",
                cache:"no-store"
            }
        );

    if(!response.ok){

        throw new Error(
            "GitHub returned HTTP " +
            response.status +
            " while downloading " +
            UPDATE_CONFIG.folder +
            "/" +
            fileName
        );

    }

    const text =
        await response.text();

    /*
        Prevent accidentally saving a GitHub error page
        as an HTML application.
    */
    if(
        !text ||
        text.trim().length < 20
    ){

        throw new Error(
            "GitHub returned an empty file for " +
            fileName
        );

    }

    return text;

}


/*
    Write text to a file inside a directory.
*/
async function writeTextFile(
    directory,
    fileName,
    contents
){

    const fileHandle =
        await directory.getFileHandle(
            fileName,
            {
                create:true
            }
        );

    const writable =
        await fileHandle.createWritable();

    try{

        await writable.write(
            contents
        );

        await writable.close();

    }catch(error){

        try{
            await writable.abort();
        }catch(_){}

        throw error;

    }

}


/*
    Get the project root.

    IMPORTANT:

    The normal SELECT handle points at:

        Project/SELECT

    It cannot write:

        Project/index.html

    because the browser does not provide a "parent directory"
    operation.

    Therefore the updater asks for the project folder once.
*/
async function chooseProjectRoot(){

    if(
        !("showDirectoryPicker" in window)
    ){

        throw new Error(
            "Your browser does not support the File System Access API. " +
            "Use a Chromium-based browser such as Chrome, Edge, or Opera."
        );

    }

    const root =
        await window.showDirectoryPicker({
            mode:"readwrite"
        });

    return root;

}


/*
    Verify that the selected folder actually contains
    the expected SELECT folder.
*/
async function verifyProjectRoot(root){

    try{

        await root.getFileHandle(
            "index.html"
        );

    }catch(error){

        throw new Error(
            'The selected folder does not contain "index.html". ' +
            'Please select the CHIMPANZINI PANANINI project folder.'
        );

    }

    try{

        await root.getDirectoryHandle(
            "SELECT"
        );

    }catch(error){

        throw new Error(
            'The selected folder does not contain a "SELECT" folder. ' +
            'Please select the CHIMPANZINI PANANINI project folder.'
        );

    }

}


/*
    Main update function.
*/
async function updateLatestVersion(){

    const originalText =
        onlineLibraryButton.textContent;

    try{

        /*
            Disable the button so the user cannot start
            two updates simultaneously.
        */

        onlineLibraryButton.disabled = true;

        onlineLibraryButton.textContent =
            "Choose Project Folder...";

        statusElement.innerHTML = `
            <strong>Latest Version Update</strong>
            <br><br>
            Select the main
            <b>CHIMPANZINI PANANINI</b>
            project folder.
            <br><br>
            This is the folder containing:
            <b>index.html</b>
            and
            <b>SELECT</b>.
        `;

        /*
            Get writable project root.
        */

        const projectRoot =
            await chooseProjectRoot();

        /*
            Verify it before downloading anything.
        */

        await verifyProjectRoot(
            projectRoot
        );

        /*
            Find SELECT.
        */

        const selectFolder =
            await projectRoot.getDirectoryHandle(
                "SELECT"
            );

        /*
            Download both files BEFORE replacing
            anything.

            This is important.

            If one download fails, the existing local
            files are left untouched.
        */

        statusElement.innerHTML = `
            <strong>Downloading latest version...</strong>
            <br><br>
            Downloading
            <b>LatestVersion/index.html</b>
        `;

        const latestIndex =
            await downloadUpdateFile(
                UPDATE_CONFIG.files.index
            );


        statusElement.innerHTML = `
            <strong>Downloading latest version...</strong>
            <br><br>
            Downloading
            <b>LatestVersion/ChimpanziniKiosk.html</b>
        `;

        const latestKiosk =
            await downloadUpdateFile(
                UPDATE_CONFIG.files.kiosk
            );


        /*
            Both downloads succeeded.

            Now replace the local files.
        */

        statusElement.innerHTML = `
            <strong>Installing latest version...</strong>
            <br><br>
            Replacing
            <b>index.html</b>
            and
            <b>SELECT/ChimpanziniKiosk.html</b>
        `;


        /*
            Replace root index.html.
        */

        await writeTextFile(
            projectRoot,
            "index.html",
            latestIndex
        );


        /*
            Replace SELECT/ChimpanziniKiosk.html.
        */

        await writeTextFile(
            selectFolder,
            "ChimpanziniKiosk.html",
            latestKiosk
        );


        /*
            Give the browser a moment to finish the filesystem
            operation before reloading.
        */

        statusElement.innerHTML = `
            <strong>Update complete!</strong>
            <br><br>
            The latest
            <b>index.html</b>
            and
            <b>ChimpanziniKiosk.html</b>
            have been installed.
            <br><br>
            Reloading...
        `;


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    700
                )
        );


        /*
            Reload the launcher.

            The browser will now load the newly written
            index.html.
        */

        location.reload();

    }catch(error){

        console.error(
            "Latest Version update failed:",
            error
        );


        if(
            error &&
            error.name === "AbortError"
        ){

            statusElement.innerHTML = `
                <strong>Update cancelled.</strong>
                <br><br>
                No files were changed.
            `;

            return;

        }


        statusElement.innerHTML = `
            <strong>Update failed.</strong>
            <br><br>
            ${escapeHTML(
                error.message ||
                String(error)
            )}
            <br><br>
            <b>No local files were intentionally replaced
            unless both GitHub downloads completed.</b>
        `;


        alert(
            "Latest Version update failed:\n\n" +
            (
                error.message ||
                String(error)
            )
        );

    }finally{

        onlineLibraryButton.disabled =
            false;

        onlineLibraryButton.textContent =
            originalText;

    }

}

/* =========================================================
   REMEMBER / RESTORE SELECT FOLDER
========================================================= */

const HANDLE_DB_NAME =
    "gooncave-launcher";

const HANDLE_STORE =
    "handles";

const HANDLE_KEY =
    "selectFolder";


function openHandleDB(){

    return new Promise(
        (resolve, reject) => {

            const request =
                indexedDB.open(
                    HANDLE_DB_NAME,
                    1
                );

            request.onupgradeneeded = () => {

                request.result
                    .createObjectStore(
                        HANDLE_STORE
                    );

            };

            request.onsuccess = () =>
                resolve(request.result);

            request.onerror = () =>
                reject(request.error);

        }
    );

}


async function rememberSelectFolder(handle){

    try{

        const db =
            await openHandleDB();

        await new Promise(
            (resolve, reject) => {

                const tx =
                    db.transaction(
                        HANDLE_STORE,
                        "readwrite"
                    );

                tx.objectStore(HANDLE_STORE)
                    .put(
                        handle,
                        HANDLE_KEY
                    );

                tx.oncomplete =
                    resolve;

                tx.onerror = () =>
                    reject(tx.error);

            }
        );

    }catch(error){

        console.warn(
            "Could not remember SELECT folder.",
            error
        );

    }

}


async function getRememberedSelectFolder(){

    try{

        const db =
            await openHandleDB();

        return await new Promise(
            (resolve, reject) => {

                const tx =
                    db.transaction(
                        HANDLE_STORE,
                        "readonly"
                    );

                const request =
                    tx.objectStore(HANDLE_STORE)
                        .get(
                            HANDLE_KEY
                        );

                request.onsuccess = () =>
                    resolve(
                        request.result ||
                        null
                    );

                request.onerror = () =>
                    reject(
                        request.error
                    );

            }
        );

    }catch(error){

        console.warn(
            "Could not read remembered SELECT folder.",
            error
        );

        return null;

    }

}


async function forgetSelectFolder(){

    try{

        const db =
            await openHandleDB();

        db.transaction(
            HANDLE_STORE,
            "readwrite"
        )
        .objectStore(
            HANDLE_STORE
        )
        .delete(
            HANDLE_KEY
        );

    }catch(error){

        // Ignore.

    }

}


/* =========================================================
   RESTORE SELECT FOLDER
========================================================= */

async function tryRestoreSelectFolder(){

    if(
        !("indexedDB" in window) ||
        !("showDirectoryPicker" in window)
    ){

        return;

    }

    const handle =
        await getRememberedSelectFolder();

    if(!handle){
        return;
    }

    let permission;

    try{

        permission =
            await handle.queryPermission({
                mode:"readwrite"
            });

    }catch(error){

        console.warn(
            "Could not query folder permission.",
            error
        );

        return;

    }


    if(permission === "granted"){

        try{

            await connectSelectFolder(
                handle
            );

        }catch(error){

            console.warn(
                "Could not reconnect SELECT folder.",
                error
            );

            await forgetSelectFolder();

        }

        return;

    }


    statusElement.innerHTML = `

        <strong>
            Reconnect to "${escapeHTML(handle.name)}"
        </strong>

        <br><br>

        <button
            id="reconnectFolder"
            class="btn primary"
        >
            Reconnect Folder
        </button>

    `;


    const reconnectButton =
        document.getElementById(
            "reconnectFolder"
        );


    if(reconnectButton){

        reconnectButton.onclick =
            async () => {

                try{

                    const granted =
                        await handle.requestPermission({
                            mode:"readwrite"
                        });

                    if(granted !== "granted"){
                        return;
                    }

                    await connectSelectFolder(
                        handle
                    );

                }catch(error){

                    console.error(
                        "Could not reconnect SELECT folder.",
                        error
                    );

                    await forgetSelectFolder();

                    statusElement.innerHTML = `

                        <strong>
                            No folder selected.
                        </strong>

                        Click
                        <b>Choose SELECT Folder</b>
                        and select:

                        <b>
                            ${escapeHTML(CONFIG.title)}/SELECT
                        </b>

                    `;

                }

            };

    }

}

/* =========================================================
   HELPERS
========================================================= */

function getExtension(name){

    const parts =
        name.toLowerCase().split(".");

    if(parts.length < 2){
        return "";
    }

    return parts.pop();

}


function cleanTitle(name){

    const extension =
        getExtension(name);

    let title =
        name.replace(
            new RegExp(
                "\\." +
                extension +
                "$",
                "i"
            ),
            ""
        );

    title =
        title.replace(
            /[\_-]+/g,
            " "
        );

    return title.trim();

}


function isPortName(name){

    const extension =
        getExtension(name);

    return (
        extension === "html" ||
        extension === "htm" ||
        extension === "b64"
    );

}


/* =========================================================
   GUESS SYSTEM
========================================================= */

function guessSystem(
    fileName,
    path=""
){

    const extension =
        getExtension(fileName);

    const lowerPath =
        path.toLowerCase();


    if(
        lowerPath.includes("gba") ||
        lowerPath.includes("game boy advance")
    ){

        return "gba";

    }


    if(
        lowerPath.includes("gbc") ||
        lowerPath.includes("game boy color")
    ){

        return "gbc";

    }


    if(
        lowerPath.includes("n64") ||
        lowerPath.includes("nintendo 64")
    ){

        return "n64";

    }


    if(
        lowerPath.includes("snes") ||
        lowerPath.includes("super nintendo")
    ){

        return "snes";

    }


    if(
        lowerPath.includes("nes") ||
        lowerPath.includes("nintendo entertainment")
    ){

        return "nes";

    }


    if(
        lowerPath.includes("ps1") ||
        lowerPath.includes("psx") ||
        lowerPath.includes("playstation")
    ){

        return "psx";

    }


    if(lowerPath.includes("psp")){
        return "psp";
    }


    if(lowerPath.includes("3ds")){
        return "3ds";
    }


    for(
        const [id,system]
        of Object.entries(SYSTEMS)
    ){

        if(
            system.extensions.includes(
                extension
            )
        ){

            return id;

        }

    }


    return null;

}


/* =========================================================
   CREATE GAME
========================================================= */

function makeGame(
    fileName,
    path
){

    const system =
        guessSystem(
            fileName,
            path
        );

    if(!system){
        return null;
    }

    return {

        name:
            cleanTitle(
                fileName
            ),

        fileName:
            fileName,

        path:
            path,

        system:
            system

    };

}


/* =========================================================
   HASH
========================================================= */

function hashId(text){

    let hash = 0;

    for(
        let i=0;
        i<text.length;
        i++
    ){

        hash =
            ((hash << 5) - hash)
            + text.charCodeAt(i);

        hash |= 0;

    }

    return String(
        Math.abs(hash)
    );

}


/* =========================================================
   SCAN DIRECTORY
========================================================= */

async function scanDirectory(
    directory,
    relativePath="",
    type="rom",
    depth=0
){

    const results = [];

    if(depth > 8){
        return results;
    }


    for await(
        const [name,entry]
        of directory.entries()
    ){

        const currentPath =
            relativePath
            ? relativePath + "/" + name
            : name;


        if(entry.kind === "directory"){

            const nested =
                await scanDirectory(
                    entry,
                    currentPath,
                    type,
                    depth + 1
                );

            results.push(
                ...nested
            );

            continue;

        }


        if(entry.kind !== "file"){
            continue;
        }


        if(type === "rom"){

            const game =
                makeGame(
                    name,
                    currentPath
                );

            if(game){

                results.push(
                    game
                );

            }

        }


        if(type === "port"){

            if(isPortName(name)){

                results.push({

                    name:
                        cleanTitle(name),

                    fileName:
                        name,

                    path:
                        currentPath

                });

            }

        }

    }


    return results;

}


/* =========================================================
   GET FILE FROM DIRECTORY
========================================================= */

async function getFileFromPath(
    rootDirectory,
    path
){

    const parts =
        path.split("/");

    const fileName =
        parts.pop();

    let directory =
        rootDirectory;


    for(
        const part of parts
    ){

        directory =
            await directory.getDirectoryHandle(
                part
            );

    }


    const fileHandle =
        await directory.getFileHandle(
            fileName
        );


    return await fileHandle.getFile();

}

/* =========================================================

========================================================= */

function escapeHTML(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

async function connectSelectFolder(
    handle
){

    selectDirectory =
        handle;

    games = [];

    ports = [];

    activeSystem =
        "all";


    /*
        Find ROMs.
    */

    try{

        romDirectory =
            await selectDirectory
                .getDirectoryHandle(
                    CONFIG.romFolder
                );

    }catch(error){

        console.warn(
            "ROMs folder not found.",
            error
        );

        romDirectory =
            null;

    }


    /*
        Find Ports.
    */

    try{

        portsDirectory =
            await selectDirectory
                .getDirectoryHandle(
                    CONFIG.portFolder
                );

    }catch(error){

        console.warn(
            "Ports folder not found.",
            error
        );

        portsDirectory =
            null;

    }


    /*
        Find/create Saves.
    */

    try{

        saveDirectory =
            await selectDirectory
                .getDirectoryHandle(
                    CONFIG.saveFolder,
                    {
                        create:true
                    }
                );

    }catch(error){

        console.warn(
            "Could not create/find Saves folder.",
            error
        );

    */

    */

    if(portsDirectory){

            await scanDirectory(
                portsDirectory,
                "",
                "port"
            );

    }


    /*

    */

    await rememberSelectFolder(
        selectDirectory
    );

/* =========================================================
   FALLBACK DIRECTORY PICKER
========================================================= */

function chooseFolderFallback(){

    const input =
        document.createElement(
            "input"
        );


    input.type =
        "file";

    input.webkitdirectory =
        true;

    input.multiple =
        true;


    input.onchange = () => {

        if(!input.files.length){
            return;
        }


        games = [];

        ports = [];

        saveDirectory =
            null;


        for(
            const file
            of input.files
        ){

            const relative =
                file.webkitRelativePath
                    .replaceAll(
                        "\\",
                        "/"
                    );


            const parts =
                relative.split("/");


            parts.shift();


            const path =
                parts.join("/");


            const lowerPath =
                path.toLowerCase();


            /*
                ROMS
            */

            if(
                lowerPath.startsWith(
                    "roms/"
                )
            ){

                const game =
                    makeGame(
                        file.name,
                        path
                    );


                if(game){

                    game.fallbackFile =
                        file;

                    games.push(
                        game
                    );

                }

            }


            /*
                PORTS
            */

            if(
                lowerPath.startsWith(
                    "ports/"
                )
            ){

                if(
                    isPortName(
                        file.name
                    )
                ){

                    ports.push({

                        name:
                            cleanTitle(
                                file.name
                            ),

                        fileName:
                            file.name,

                        path:
                            path,

                        fallbackFile:
                            file

                    });

                }

            }

        }


        statusElement.innerHTML = `

            <strong>
                SELECT folder loaded.
            </strong>

            ${games.length}
            ROM games and

            ${ports.length}
            ports found.

            <strong>

                The Saves folder requires the modern
                folder picker to write files.

            </strong>

        `;


        render();

    };


    input.click();

}


/* =========================================================
   SAVE FOLDER PERMISSION
========================================================= */

async function ensureSaveFolderPermission(
    promptIfNeeded = true
){

    if(!saveDirectory){
        return false;
    }


    try{

        let state =
            await saveDirectory.queryPermission({
                mode:"readwrite"
            });


        if(state === "granted"){
            return true;
        }


        if(promptIfNeeded){

            state =
                await saveDirectory.requestPermission({
                    mode:"readwrite"
                });

            return state === "granted";

        }


        return false;

    }catch(error){

        console.warn(
            "Saves permission error:",
            error
        );

        return false;

    }

}


/* =========================================================
   WRITE SAVE FILE
========================================================= */

async function writeSaveFile(
    fileName,
    contents
){

    if(!saveDirectory){

        console.warn(
            "No Saves folder connected."
        );

        return false;

    }


    try{

        const allowed =
            await ensureSaveFolderPermission(
                true
            );


        if(!allowed){

            console.warn(
                "Saves folder permission denied."
            );

            return false;

        }


        const fileHandle =
            await saveDirectory.getFileHandle(
                fileName,
                {
                    create:true
                }
            );


        const writable =
            await fileHandle.createWritable();


        await writable.write(
            contents
        );


        await writable.close();


        console.log(
            "Save written:",
            fileName
        );


        return true;

    }catch(error){

        console.error(
            "Could not write save file:",
            error
        );

        return false;

    }

}


/* =========================================================
   READ SAVE FILE
========================================================= */

async function readSaveFile(
    fileName
){

    if(!saveDirectory){
        return null;
    }


    try{

        const allowed =
            await ensureSaveFolderPermission(
                true
            );


        if(!allowed){
            return null;
        }


        const fileHandle =
            await saveDirectory.getFileHandle(
                fileName
            );


        const file =
            await fileHandle.getFile();


        return await file.text();

    }catch(error){

        return null;

    }

}

async function readSaveFileBinary(
    fileName
){

    if(!saveDirectory){
        return null;
    }


    try{

        const allowed =
            await ensureSaveFolderPermission(
                true
            );


        if(!allowed){

        );

}


function armPendingAutosaveWait(){

    pendingAutosavePromise =
        new Promise(
            resolve => {

                pendingAutosaveResolve =
                    resolve;

            }
        );


    return pendingAutosavePromise;

}


async function flushEmulatorSaveBeforeExit(){

    const emulator =
        window.EJS_emulator;


    if(
        !emulator ||
        !emulator.gameManager ||
        typeof emulator.gameManager.saveSaveFiles !==
            "function"
    ){

        return;

    }


    try{

        const waitForWrite =
            armPendingAutosaveWait();


        emulator.gameManager.saveSaveFiles();


        await Promise.race([

            waitForWrite,

            new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        1500
                    )
            )

        ]);

    }catch(error){

        console.error(
            "Could not flush save before exit:",
            error
        );

    }

}


async function loadEmulatorSaveOnStart(
    gameId
){

    const emulator =
        window.EJS_emulator;


    if(
        !emulator ||
        !emulator.gameManager
    ){

        return;

    }


    const bytes =
        await readSaveFileBinary(
            emulatorSaveFileName(
                gameId
            )
        );


    if(!bytes){
        return;
    }


    const gameManager =
        emulator.gameManager;


    const path =
        gameManager.getSaveFilePath();


    const parts =
        path.split("/");


    let currentPath = "";


    for(
        let i=0;
        i<parts.length - 1;
        i++
    ){

        if(parts[i] === ""){
            continue;
        }


        currentPath +=
            "/" + parts[i];


        if(
            !gameManager.FS
                .analyzePath(
                    currentPath
                )
                .exists
        ){

            gameManager.FS.mkdir(
                currentPath
            );

        }

    }


    if(
        gameManager.FS
            .analyzePath(
                path
            )
            .exists
    ){

        gameManager.FS.unlink(
            path
        );

    }


    gameManager.FS.writeFile(
        path,
        bytes
    );


    gameManager.loadSaveFiles();

}


/* =========================================================
   SAVE BRIDGE
========================================================= */

window.addEventListener(
    "message",
    async event => {

        if(
            event.source !==
            portFrame.contentWindow
        ){

            return;

        }


        const message =
            event.data;


        if(
            !message ||
            message.source !==
            "pvz-portable"
        ){

            return;

        }


        const type =
            message.type;

        const payload =
            message.payload || {};

        const id =
            payload.id;


        /*
            SAVE
        */

        if(
            type ===
            "folder-save-request"
        ){

            const ok =
                await writeSaveFile(
                    payload.fileName,
                    payload.contents
                );


            portFrame.contentWindow.postMessage(
                {
                    source:
                        "pvz-portable-host",

                    payload:{
                        id:id,
                        ok:ok
                    }
                },
                "*"
            );


            return;

        }


        /*
            LOAD
        */

        if(
            type ===
            "folder-load-request"
        ){

            const contents =
                await readSaveFile(
                    payload.fileName
                );


            portFrame.contentWindow.postMessage(
                {
                    source:
                        "pvz-portable-host",

                    payload:{
                        id:id,

                        ok:
                            contents !== null,

                        contents:
                            contents
                    }
                },
                "*"
            );


            return;

        }

    }
);


/* =========================================================
   CREATE ROM URL
========================================================= */

async function createROMURL(
    game
){

    if(romDirectory){

        const file =
            await getFileFromPath(
                romDirectory,
                game.path
            );


        return URL.createObjectURL(
            file
        );

    }


    if(game.fallbackFile){

        return URL.createObjectURL(
            game.fallbackFile
        );

    }


    throw new Error(
        "Could not access ROM file."
    );

}


/* =========================================================
   PLAY ROM
========================================================= */

async function playGame(
    game
){

    try{

        if(activeBlobUrl){

            URL.revokeObjectURL(
                activeBlobUrl
            );

            activeBlobUrl =
                null;

        }


        const romURL =
            await createROMURL(
                game
            );


        activeBlobUrl =
            romURL;


        portFrame.hidden =
            true;

        portFrame.src =
            "about:blank";


        gameElement.hidden =
            false;


        player.classList.remove(
            "hidden"
        );


        window.EJS_player =
            "#game";


        window.EJS_core =
            game.system;


        window.EJS_gameName =
            game.key ||
            game.name;


        const gameId =
            hashId(
                game.system +
                ":" +
                game.name
            );


        window.EJS_gameID =
            gameId;


        window.EJS_gameUrl =
            romURL;


        window.EJS_pathtodata =
            CONFIG.emulatorData;


        window.EJS_startOnLoaded =
            true;


        window.EJS_color =
            "#7c5cff";


        window.EJS_askBeforeExit =
            false;


        window.EJS_threads =
            (
                game.system === "psp" ||
                game.system === "3ds"
            );


        window.EJS_onGameStart =
            async () => {

                await loadEmulatorSaveOnStart(
                    gameId
                );

            };


        window.EJS_onSaveUpdate =
            async data => {

                await writeSaveFileBinary(
                    emulatorSaveFileName(
                        gameId
                    ),
                    data.save
                );


                if(pendingAutosaveResolve){

                    pendingAutosaveResolve();

                    pendingAutosaveResolve =
                        null;

                }

            };


        window.EJS_fixedSaveInterval =
            CONFIG.autosaveIntervalMs;


        window.EJS_Buttons =
            {
                exitEmulation:false
            };


        window.EJS_onSaveSave =
            async data => {

                await writeSaveFileBinary(
                    emulatorSaveFileName(
                        gameId
                    ),
                    data.save
                );

            };


        window.EJS_onLoadSave =
            async () => {

                await loadEmulatorSaveOnStart(
                    gameId
                );

            };


        window.EJS_onSaveState =
            async data => {

                await writeSaveFileBinary(
                    emulatorStateFileName(
                        gameId
                    ),
                    data.state
                );

            };


        window.EJS_onLoadState =
            async () => {

                const bytes =
                    await readSaveFileBinary(
                        emulatorStateFileName(
                            gameId
                        )
                    );


                if(
                    bytes &&
                    window.EJS_emulator &&
                    window.EJS_emulator.gameManager
                ){

                    window.EJS_emulator.gameManager
                        .loadState(
                            bytes
                        );

                }

            };


        /*
            Remove old EmulatorJS loader.
        */

        const oldLoader =
            document.getElementById(
                "emulatorjs-loader"
            );


        if(oldLoader){
            oldLoader.remove();
        }


        /*
            Load EmulatorJS.
        */

        const script =
            document.createElement(
                "script"
            );


        script.id =
            "emulatorjs-loader";


        script.src =
            CONFIG.emulatorData +
            "loader.js";


        script.onerror = () => {

            alert(
                "EmulatorJS could not be loaded.\n\n" +
                "Check your internet connection."
            );

        };


        document.body.appendChild(
            script
        );

    }catch(error){

        console.error(
            error
        );


        alert(
            "Could not start game:\n\n" +
            error.message
        );

    }

}


/* =========================================================
   GET PORT FILE
========================================================= */

async function getPortFile(
    port
){

    if(portsDirectory){

        return await getFileFromPath(
            portsDirectory,
            port.path
        );

    }


    if(port.fallbackFile){

        return port.fallbackFile;

    }


    throw new Error(
        "Could not access port file."
    );

}


/* =========================================================
   PLAY PORT
========================================================= */

async function playPort(
    port
){

    try{

        if(activeBlobUrl){

            URL.revokeObjectURL(
                activeBlobUrl
            );

            activeBlobUrl =
                null;

        }


        const file =
            await getPortFile(
                port
            );


        const extension =
            getExtension(
                file.name
            );


        /*
            Normal HTML.
        */

        if(
            extension === "html" ||
            extension === "htm"
        ){

            activeBlobUrl =
                URL.createObjectURL(
                    file
                );


            portFrame.src =
                activeBlobUrl;

        }


        /*
            Base64 HTML.
        */

        else if(
            extension === "b64"
        ){

            const text =
                await file.text();


            let decoded;


            try{

                decoded =
                    atob(
                        text.replace(
                            /\s/g,
                            ""
                        )
                    );

            }catch(error){

                throw new Error(
                    "This .b64 file is not valid Base64."
                );

            }


            const bytes =
                new Uint8Array(
                    decoded.length
                );


            for(
                let i=0;
                i<decoded.length;
                i++
            ){

                bytes[i] =
                    decoded.charCodeAt(i);

            }


            const htmlBlob =
                new Blob(
                    [bytes],
                    {
                        type:"text/html"
                    }
                );


            activeBlobUrl =
                URL.createObjectURL(
                    htmlBlob
                );


            portFrame.src =
                activeBlobUrl;

        }


        gameElement.hidden =
            true;

        portFrame.hidden =
            false;


        player.classList.remove(
            "hidden"
        );

    }catch(error){

        console.error(
            error
        );


        alert(
            "Could not start port:\n\n" +
            error.message
        );

    }

}

            searchElement

            searchElement.focus();

            event.key === "Escape" &&
            document.activeElement ===
            searchElement

    }
);
