/* =========================================================
   RUNTIME TRACKER

   A running game can keep going in the background after you
   leave it (music, emulator threads, game loops). To be able
   to really shut it down, remember every AudioContext and
   Worker created by this page so leaveGame() can close them.
   This must run before any emulator code loads.
========================================================= */

const trackedAudioContexts = new Set();

const trackedWorkers = new Set();

(function(){

    for(const name of ["AudioContext","webkitAudioContext"]){

        const Original = window[name];

        if(typeof Original !== "function"){
            continue;
        }

        try{

            window[name] = class extends Original {

                constructor(...args){

                    super(...args);

                    trackedAudioContexts.add(this);

                }

            };

        }catch(error){

            console.warn("Could not track " + name, error);

        }

    }

    if(typeof window.Worker === "function"){

        const OriginalWorker = window.Worker;

        try{

            window.Worker = class extends OriginalWorker {

                constructor(...args){

                    super(...args);

                    trackedWorkers.add(this);

                }

            };

        }catch(error){

            console.warn("Could not track Worker", error);

        }

    }

})();

    emulatorData: /[\\/]SELECT[\\/]/i.test(location.pathname)

/*
    Lets leaveGame() (the "<- Back" button) wait for an in-flight
    autosave write to actually finish before it reloads the page -

let pendingAutosaveResolve = null;

/* =========================================================
   REMEMBER / RESTORE SELECT FOLDER (IndexedDB)

   The browser can keep letting us use a folder we've already
   been granted access to, even after location.reload(). We
   just have to hang on to the FileSystemDirectoryHandle
   ourselves (in IndexedDB, since a plain JS variable doesn't
   survive a reload) and re-check permission on startup.
========================================================= */

const HANDLE_DB_NAME =
    "gooncave-launcher";

const HANDLE_STORE =
    "handles";

const HANDLE_KEY =
    "selectFolder";

function openHandleDB(){

    return new Promise(
        (resolve, reject) => {

            const request =
                indexedDB.open(
                    HANDLE_DB_NAME,
                    1
                );

            request.onupgradeneeded = () => {

                request.result
                    .createObjectStore(
                        HANDLE_STORE
                    );

            };

            request.onsuccess = () =>
                resolve(request.result);

            request.onerror = () =>
                reject(request.error);

        }
    );

}

async function rememberSelectFolder(handle){

    try{

        const db =
            await openHandleDB();

        await new Promise(
            (resolve, reject) => {

                const tx =
                    db.transaction(
                        HANDLE_STORE,
                        "readwrite"
                    );

                tx.objectStore(HANDLE_STORE)
                    .put(handle, HANDLE_KEY);

                tx.oncomplete = resolve;

                tx.onerror = () =>
                    reject(tx.error);

            }
        );

    }catch(error){

        /*
            Not fatal - the app just falls back to manual
            folder selection next time if this couldn't
            be saved.
        */

        console.warn(
            "Could not remember SELECT folder.",
            error
        );

    }

}

async function getRememberedSelectFolder(){

    try{

        const db =
            await openHandleDB();

        return await new Promise(
            (resolve, reject) => {

                const tx =
                    db.transaction(
                        HANDLE_STORE,
                        "readonly"
                    );

                const request =
                    tx.objectStore(HANDLE_STORE)
                        .get(HANDLE_KEY);

                request.onsuccess = () =>
                    resolve(request.result || null);

                request.onerror = () =>
                    reject(request.error);

            }
        );

    }catch(error){

        console.warn(
            "Could not read remembered SELECT folder.",
            error
        );

        return null;

    }

}

async function forgetSelectFolder(){

    try{

        const db =
            await openHandleDB();

        db.transaction(HANDLE_STORE, "readwrite")
            .objectStore(HANDLE_STORE)
            .delete(HANDLE_KEY);

    }catch(error){

        // Ignore - nothing to clean up.

    }

}

/*
    On startup (including right after leaveGame's reload),
    try to reconnect to the last SELECT folder without making
    the user browse for it again.

    If the browser still remembers granting permission, this
    reconnects completely silently. Otherwise it shows a single
    "Reconnect Folder" button - one click, no folder browsing -
    instead of the full picker.
*/
async function tryRestoreSelectFolder(){

    if(
        !("indexedDB" in window) ||
        !("showDirectoryPicker" in window)
    ){
        return;
    }

    const handle =
        await getRememberedSelectFolder();

    if(!handle){
        return;
    }

    let permission;

    try{

        permission =
            await handle.queryPermission({
                mode:"readwrite"
            });

    }catch(error){

        console.warn(
            "Could not query folder permission.",
            error
        );

        return;

    }

    if(permission === "granted"){

        try{

            await connectSelectFolder(handle);

        }catch(error){

            console.warn(
                "Could not reconnect SELECT folder.",
                error
            );

            await forgetSelectFolder();

        }

        return;

    }

    statusElement.innerHTML = `

        <strong>
            Reconnect to "${escapeHTML(handle.name)}"
        </strong>

        <br><br>

        <button id="reconnectFolder" class="btn primary">
            Reconnect Folder
        </button>

    `;

    const reconnectButton =
        document.getElementById(
            "reconnectFolder"
        );

    if(reconnectButton){

        reconnectButton.onclick = async () => {

            try{

                const granted =
                    await handle.requestPermission({
                        mode:"readwrite"
                    });

                if(granted !== "granted"){
                    return;
                }

                await connectSelectFolder(handle);

            }catch(error){

                console.error(
                    "Could not reconnect SELECT folder.",
                    error
                );

                await forgetSelectFolder();

                statusElement.innerHTML = `

                    <strong>No folder selected.</strong>

                    Click

                    <b>Choose SELECT Folder</b>

                    and select:

                    <b>${escapeHTML(CONFIG.title)}/SELECT</b>

                `;

            }

        };

    }

}

/* =========================================================
   HELPERS
========================================================= */

function getExtension(name){

    const parts =
        name.toLowerCase().split(".");

    if(parts.length < 2){
        return "";
    }

    return parts.pop();
}


function cleanTitle(name){

    const extension =
        getExtension(name);

    let title =
        name.replace(
            new RegExp("\\." + extension + "$","i"),
            ""
        );

    title =
        title.replace(
            /[_-]+/g,
            " "
        );

    return title.trim();
}


function isPortName(name){

    const extension =
        getExtension(name);

    return (
        extension === "html" ||
        extension === "htm" ||
        extension === "b64"
    );
}


/* =========================================================
   GUESS SYSTEM
========================================================= */

function guessSystem(fileName, path=""){

    const extension =
        getExtension(fileName);

    const lowerPath =
        path.toLowerCase();


    if(
        lowerPath.includes("gba") ||
        lowerPath.includes("game boy advance")
    ){
        return "gba";
    }


    if(
        lowerPath.includes("gbc") ||
        lowerPath.includes("game boy color")
    ){
        return "gbc";
    }


    if(
        lowerPath.includes("n64") ||
        lowerPath.includes("nintendo 64")
    ){
        return "n64";
    }


    if(
        lowerPath.includes("snes") ||
        lowerPath.includes("super nintendo")
    ){
        return "snes";
    }


    if(
        lowerPath.includes("nes") ||
        lowerPath.includes("nintendo entertainment")
    ){
        return "nes";
    }


    if(
        lowerPath.includes("ps1") ||
        lowerPath.includes("psx") ||
        lowerPath.includes("playstation")
    ){
        return "psx";
    }


    if(lowerPath.includes("psp")){
        return "psp";
    }


    if(lowerPath.includes("3ds")){
        return "3ds";
    }


    for(
        const [id,system]
        of Object.entries(SYSTEMS)
    ){

        if(
            system.extensions.includes(
                extension
            )
        ){
            return id;
        }

    }


    return null;
}


/* =========================================================
   CREATE GAME
========================================================= */

function makeGame(fileName,path){

    const system =
        guessSystem(
            fileName,
            path
        );

    if(!system){
        return null;
    }

    return {

        name:cleanTitle(fileName),

        fileName:fileName,

        path:path,

        system:system

    };
}


/* =========================================================
   HASH
========================================================= */

function hashId(text){

    let hash = 0;

    for(
        let i=0;
        i<text.length;
        i++
    ){

        hash =
            ((hash << 5) - hash)
            + text.charCodeAt(i);

        hash |= 0;

    }

    return String(
        Math.abs(hash)
    );
}


/* =========================================================
   SCAN DIRECTORY
========================================================= */

async function scanDirectory(
    directory,
    relativePath="",
    type="rom",
    depth=0
){

    const results = [];


    if(depth > 8){
        return results;
    }


    for await(
        const [name,entry]
        of directory.entries()
    ){

        const currentPath =
            relativePath
            ? relativePath + "/" + name
            : name;


        if(entry.kind === "directory"){

            const nested =
                await scanDirectory(
                    entry,
                    currentPath,
                    type,
                    depth + 1
                );

            results.push(
                ...nested
            );

            continue;
        }


        if(entry.kind !== "file"){
            continue;
        }


        if(type === "rom"){

            const game =
                makeGame(
                    name,
                    currentPath
                );

            if(game){
                results.push(game);
            }

        }


        if(type === "port"){

            if(isPortName(name)){

                results.push({

                    name:cleanTitle(name),

                    fileName:name,

                    path:currentPath

                });

            }

        }

    }


    return results;
}


/* =========================================================
   GET FILE FROM DIRECTORY
========================================================= */

async function getFileFromPath(
    rootDirectory,
    path
){

    const parts =
        path.split("/");

    const fileName =
        parts.pop();

    let directory =
        rootDirectory;


    for(const part of parts){

        directory =
            await directory.getDirectoryHandle(
                part
            );

    }


    const fileHandle =
        await directory.getFileHandle(
            fileName
        );


    return await fileHandle.getFile();
}


/* =========================================================
   RENDER FILTERS

function renderFilters(){

    filtersElement.innerHTML = "";


    const allButton =
        document.createElement("button");

    allButton.className =
        "chip" +
        (
            activeSystem === "all"
                ? " active"
                : ""
        );

    allButton.textContent =
        "All";


    allButton.onclick = () => {

        activeSystem = "all";

        render();

    };


    filtersElement.appendChild(
        allButton
    );


    const usedSystems =
        [
            ...new Set(
                games.map(
                    game => game.system
                )
            )
        ];


    usedSystems.sort(
        (a,b) =>
            (
                SYSTEMS[a]?.name || a
            ).localeCompare(
                SYSTEMS[b]?.name || b
            )
    );


    for(const systemId of usedSystems){

        const button =
            document.createElement("button");


        button.className =
            "chip" +
            (
                activeSystem === systemId
                    ? " active"
                    : ""
            );


        button.textContent =
            SYSTEMS[systemId]?.name ||
            systemId;


        button.onclick = () => {

            activeSystem =
                systemId;

            render();

        };


        filtersElement.appendChild(
            button
        );

    }

}

            .trim()
            .toLowerCase();


    const filtered =
        games.filter(game => {

            if(
                activeSystem !== "all" &&
                game.system !== activeSystem
            ){
                return false;
            }


            if(search){

                const searchable =
                    (
                        game.name +
                        " " +
                        game.fileName +
                        " " +
                        (
                            SYSTEMS[
                                game.system
                            ]?.name || ""
                        )
                    ).toLowerCase();


                if(
                    !searchable.includes(search)
                ){
                    return false;
                }

            }


            return true;

        });


    if(filtered.length === 0){

        gamesGrid.innerHTML =
            `<div class="empty">
                No ROM games found.
            </div>`;

        return;

    }


    filtered.sort(
        (a,b) =>
            a.name.localeCompare(
                b.name
            )
    );


    for(const game of filtered){

        const card =
            document.createElement("button");

        card.className =
            "card";


        card.innerHTML = `

            <div class="cardTitle">
                ${escapeHTML(game.name)}
            </div>

            <div class="cardMeta">
                ${escapeHTML(
                    SYSTEMS[
                        game.system
                    ]?.name ||
                    game.system
                )}
            </div>

        `;


        card.onclick = () => {

            playGame(game);

        };


        gamesGrid.appendChild(card);

    }

}


/* =========================================================
   RENDER PORTS
========================================================= */

function renderPorts(){

    portsGrid.innerHTML = "";


    const search =
        searchElement.value
            .trim()
            .toLowerCase();


    const filtered =
        ports.filter(port => {

            if(!search){

            }


            const searchable =
                (
                    port.name +
                    " " +
                    port.fileName +
                    " " +
                    port.path
                ).toLowerCase();

            );

        portsSection.hidden =

            </div>

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    renderFilters();

    renderGames();

    renderPorts();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

   STATUS
========================================================= */

function updateStatus(){

    const portCount =

    let saveText;

}


/* =========================================================
   CHOOSE SELECT FOLDER
========================================================= */

/*
    Shared by both a fresh folder pick and an automatic
    reconnect on startup: given a SELECT directory handle we
    already have permission for, find ROMs/Ports/Saves inside
    it, scan them, remember the handle for next time, and
    render the library.
*/
async function connectSelectFolder(handle){

    selectDirectory =
        handle;

    games = [];

    ports = [];

    activeSystem = "all";


    /*
        Find ROMs.
    */

    try{

        romDirectory =
            await selectDirectory
                .getDirectoryHandle(
                    CONFIG.romFolder
                );

    }catch(error){

        console.warn(
            "ROMs folder not found.",
            error
        );

        romDirectory =
            null;

    }


    /*
        Find Ports.
    */

    try{

        portsDirectory =
            await selectDirectory
                .getDirectoryHandle(
                    CONFIG.portFolder
                );

    }catch(error){

        console.warn(
            "Ports folder not found.",
            error
        );

        portsDirectory =
            null;

    }


    /*
        Find Saves automatically.

        NO SECOND FOLDER PICKER.
    */

    try{

        saveDirectory =
            await selectDirectory
                .getDirectoryHandle(
                    CONFIG.saveFolder,
                    {
                        create:true
                    }
                );

    }catch(error){

        console.warn(
            "Could not create/find Saves folder.",
            error
        );

        saveDirectory =
            null;

    }


    /*
        Scan ROMs.
    */

    if(romDirectory){

        games =
            await scanDirectory(
                romDirectory,
                "",
                "rom"
            );

    }


    /*
        Scan Ports.
    */

    if(portsDirectory){

        ports =
            await scanDirectory(
                portsDirectory,
                "",
                "port"
            );

    }


    /*
        Remember this folder so leaveGame's reload
        (or the next time this page is opened) can
        reconnect without the user re-browsing for it.
    */

    await rememberSelectFolder(
        selectDirectory
    );


    updateStatus();

    render();

}


async function chooseSelectFolder(){

    /*
        Clear old handles before picking a new one.
    */

    selectDirectory = null;

    romDirectory = null;

    portsDirectory = null;

    saveDirectory = null;

    games = [];

    ports = [];

    activeSystem = "all";


    try{

        /*
            Modern browsers.
        */

        if(
            "showDirectoryPicker"
            in window
        ){

            /*
                READWRITE is important because the
                Saves folder needs to be writable.
            */

            const selected =
                await window.showDirectoryPicker({

                    mode:"readwrite"

                });


            /*
                The user should select SELECT.
            */

            if(
                selected.name !==
                CONFIG.selectFolder
            ){

                const proceed =
                    confirm(

                        `You selected "${selected.name}".\n\n` +

                        `Please select the "SELECT" folder.\n\n` +

                        `Press OK to use this folder anyway, ` +

                        `or Cancel to choose again.`

                    );


                if(!proceed){
                    return;
                }

            }


            await connectSelectFolder(
                selected
            );

            return;

        }


        /*
            Fallback for browsers that don't support
            showDirectoryPicker.
        */

        chooseFolderFallback();

    }catch(error){

        console.error(
            "Folder selection failed:",
            error
        );


        if(
            error &&
            error.name === "AbortError"
        ){

            return;

        }


        statusElement.innerHTML = `

            <strong>
                Could not open SELECT folder.
            </strong>

            ${escapeHTML(
                error.message ||
                String(error)
            )}

        `;

    }

}


/* =========================================================
   FALLBACK DIRECTORY PICKER
========================================================= */

function chooseFolderFallback(){

    const input =
        document.createElement("input");


    input.type =
        "file";


    input.webkitdirectory =
        true;


    input.multiple =
        true;


    input.onchange = () => {

        if(!input.files.length){
            return;
        }


        games = [];

        ports = [];


        /*
            Fallback cannot automatically create a
            writable Saves directory.

            It can still load the ROMs and Ports.
        */

        saveDirectory = null;


        for(const file of input.files){

            const relative =
                file.webkitRelativePath
                    .replaceAll(
                        "\\",
                        "/"
                    );


            const parts =
                relative.split("/");


            /*
                Remove SELECT.
            */

            parts.shift();


            const path =
                parts.join("/");


            const lowerPath =
                path.toLowerCase();


            /*
                ROMS
            */

            if(
                lowerPath.startsWith(
                    "roms/"
                )
            ){

                const game =
                    makeGame(
                        file.name,
                        path
                    );


                if(game){

                    game.fallbackFile =
                        file;

                    games.push(game);

                }

            }


            /*
                PORTS
            */

            if(
                lowerPath.startsWith(
                    "ports/"
                )
            ){

                if(isPortName(file.name)){

                    ports.push({

                        name:
                            cleanTitle(
                                file.name
                            ),

                        fileName:
                            file.name,

                        path:path,

                        fallbackFile:
                            file

                    });

                }

            }

        }


        statusElement.innerHTML = `

            <strong>SELECT folder loaded.</strong>

            ${games.length}
            ROM games and

            ${ports.length}
            ports found.

            <strong>
                The Saves folder requires the modern
                folder picker to write files.
            </strong>

        `;


        render();

    };


    input.click();

}


/* =========================================================
   SAVE FOLDER PERMISSION
========================================================= */

async function ensureSaveFolderPermission(
    promptIfNeeded = true
){

    if(!saveDirectory){
        return false;
    }


    try{

        let state =
            await saveDirectory.queryPermission({

                mode:"readwrite"

            });


        if(state === "granted"){
            return true;
        }


        if(promptIfNeeded){

            state =
                await saveDirectory.requestPermission({

                    mode:"readwrite"

                });


            return state === "granted";

        }


        return false;

    }catch(error){

        console.warn(
            "Saves permission error:",
            error
        );

        return false;

    }

}


/* =========================================================
   WRITE SAVE FILE
========================================================= */

async function writeSaveFile(
    fileName,
    contents
){

    if(!saveDirectory){

        console.warn(
            "No Saves folder connected."
        );

        return false;

    }


    try{

        /*
            Ask for permission if necessary.
        */

        const allowed =
            await ensureSaveFolderPermission(
                true
            );


        if(!allowed){

            console.warn(
                "Saves folder permission denied."
            );

            return false;

        }


        const fileHandle =
            await saveDirectory.getFileHandle(

                fileName,

                {
                    create:true
                }

            );


        const writable =
            await fileHandle.createWritable();


        await writable.write(
            contents
        );


        await writable.close();


        console.log(
            "Save written:",
            fileName
        );


        return true;

    }catch(error){

        console.error(
            "Could not write save file:",
            error
        );

        return false;

    }

}


/* =========================================================
   READ SAVE FILE
========================================================= */

async function readSaveFile(
    fileName
){

    if(!saveDirectory){

        console.warn(
            "No Saves folder connected."
        );

        return null;
    }


    try{

        const allowed =
            await ensureSaveFolderPermission(
                true
            );


        if(!allowed){

            console.warn(
                "Saves folder permission denied."
            );

            return null;
        }


        const fileHandle =
            await saveDirectory.getFileHandle(
                fileName
            );


        const file =
            await fileHandle.getFile();


        const text =
            await file.text();

        console.log(
            "Save read:",
            fileName,
            "(" + text.length + " chars)"
        );

        return text;

    }catch(error){

        /*
            NotFoundError is normal if this is the
            first time the game is being played -
            anything else is a real problem, so it's
            logged instead of swallowed.
        */

        if(error && error.name === "NotFoundError"){

            console.log(
                "No existing save file yet:",
                fileName
            );

        }else{

            console.error(
                "Could not read save file:",
                fileName,
                error
            );

        }

        return null;

    }

}


/* =========================================================
   EMULATORJS SAVE BRIDGE

   Ports (above) exchange text-based save data over
   postMessage. EmulatorJS's own saves/states are raw binary
   (Uint8Array), so these use the same Saves folder and the
   same permission check, but write/read bytes directly
   instead of going through file.text().
========================================================= */

function emulatorSaveFileName(gameId){

    return gameId + ".srm";

}

function emulatorStateFileName(gameId){

    return gameId + ".state";

}

async function writeSaveFileBinary(
    fileName,
    bytes
){

    if(
        !saveDirectory ||
        !bytes
    ){
        return false;
    }


    try{

        const allowed =
            await ensureSaveFolderPermission(
                true
            );


        if(!allowed){
            return false;
        }


        const fileHandle =
            await saveDirectory.getFileHandle(

                fileName,

                {
                    create:true
                }

            );


        const writable =
            await fileHandle.createWritable();


        await writable.write(
            bytes
        );


        await writable.close();


        return true;

    }catch(error){

        console.error(
            "Could not write EmulatorJS save file:",
            error
        );

        return false;

    }

}

async function readSaveFileBinary(
    fileName
){

    if(!saveDirectory){
        return null;
    }


    try{

        const allowed =
            await ensureSaveFolderPermission(
                true
            );


        if(!allowed){
            return null;
        }


        const fileHandle =
            await saveDirectory.getFileHandle(
                fileName
            );


        const file =
            await fileHandle.getFile();


        const buffer =
            await file.arrayBuffer();


        return new Uint8Array(
            buffer
        );

    }catch(error){

        /*
            FileNotFound is normal the first time this
            game is played - it just hasn't saved yet.
        */

        return null;

    }

}

/*
    Arms a promise that resolves the next time EJS_onSaveUpdate
    finishes writing a save to disk (see below). Call this right
    before forcing a save, then await the returned promise (with a
    timeout) to know the write actually landed.
*/
function armPendingAutosaveWait(){

    pendingAutosavePromise =
        new Promise(resolve => {

            pendingAutosaveResolve =
                resolve;

        });


    return pendingAutosavePromise;

}

/*
    Forces EmulatorJS to flush the current battery/SRAM save right
    now (the same thing EJS_fixedSaveInterval does periodically),
    and waits briefly for that write to actually finish before
    returning. Used when the player is about to leave the game, so
    a save isn't abandoned mid-write by the page reload.

    If nothing has changed since the last save, EJS_onSaveUpdate
    never fires (EmulatorJS skips it via hash comparison), so this
    also has a short timeout instead of waiting forever.
*/
async function flushEmulatorSaveBeforeExit(){

    const emulator =
        window.EJS_emulator;


    if(
        !emulator ||
        !emulator.gameManager ||
        typeof emulator.gameManager.saveSaveFiles !==
            "function"
    ){
        return;
    }


    try{

        const waitForWrite =
            armPendingAutosaveWait();


        emulator.gameManager.saveSaveFiles();


        await Promise.race([

            waitForWrite,

            new Promise(
                resolve => setTimeout(resolve, 1500)
            )

        ]);

    }catch(error){

        console.error(
            "Could not flush save before exit:",
            error
        );

    }

}

/*
    Writes bytes straight into EmulatorJS's own emulated
    filesystem at the path the running core expects its save
    file to be, then tells the core to re-read it. This is
    the same technique EmulatorJS's own "Load Save File"
    button uses.
*/
async function loadEmulatorSaveOnStart(gameId){

    const emulator =
        window.EJS_emulator;


    if(
        !emulator ||
        !emulator.gameManager
    ){
        return;
    }


    const bytes =
        await readSaveFileBinary(
            emulatorSaveFileName(gameId)
        );


    if(!bytes){
        return;
    }


    const gameManager =
        emulator.gameManager;


    const path =
        gameManager.getSaveFilePath();


    const parts =
        path.split("/");


    let currentPath = "";


    for(
        let i = 0;
        i < parts.length - 1;
        i++
    ){

        if(parts[i] === ""){
            continue;
        }

        currentPath +=
            "/" + parts[i];

        if(
            !gameManager.FS
                .analyzePath(currentPath)
                .exists
        ){

            gameManager.FS.mkdir(
                currentPath
            );

        }

    }


    if(
        gameManager.FS
            .analyzePath(path)
            .exists
    ){

        gameManager.FS.unlink(
            path
        );

    }


    gameManager.FS.writeFile(
        path,
        bytes
    );


    gameManager.loadSaveFiles();

}


/* =========================================================
   SAVE BRIDGE
========================================================= */

/*
    A port such as PVZ runs inside portFrame.

    The port can send:

        folder-save-request

    or:

        folder-load-request

    to this launcher.

    The launcher then accesses:

        SELECT/Saves/

    and sends the result back.
*/

window.addEventListener(
    "message",
    async event => {

        /*
            Only accept messages from our current
            port iframe.
        */

        if(
            event.source !==
            portFrame.contentWindow
        ){

            return;

        }


        const message =
            event.data;


        if(
            !message ||
            message.source !==
            "pvz-portable"
        ){

            return;

        }


        const type =
            message.type;


        const payload =
            message.payload || {};


        const id =
            payload.id;


        /*
            SAVE
        */

        if(
            type ===
            "folder-save-request"
        ){

            const ok =
                await writeSaveFile(

                    payload.fileName,

                    payload.contents

                );


            portFrame.contentWindow.postMessage(

                {

                    source:
                        "pvz-portable-host",

                    payload:{

                        id:id,

                        ok:ok

                    }

                },

                "*"

            );


            return;

        }


        /*
            LOAD
        */

        if(
            type ===
            "folder-load-request"
        ){

            const contents =
                await readSaveFile(

                    payload.fileName

                );


            portFrame.contentWindow.postMessage(

                {

                    source:
                        "pvz-portable-host",

                    payload:{

                        id:id,

                        ok:
                            contents !== null,

                        contents:
                            contents

                    }

                },

                "*"

            );


            return;

        }

    }
);


/* =========================================================
   CREATE ROM URL
========================================================= */

async function createROMURL(game){

    /*
        Modern folder picker.
    */

    if(romDirectory){

        const file =
            await getFileFromPath(

                romDirectory,

                game.path

            );


        return URL.createObjectURL(
            file
        );

    }


    /*
        Fallback.
    */

    if(game.fallbackFile){

        return URL.createObjectURL(
            game.fallbackFile
        );

    }


    throw new Error(
        "Could not access ROM file."
    );

}


/* =========================================================
   PLAY ROM
========================================================= */

async function playGame(game){

    try{

        if(emulatorUsed || gameStopped){

            resetEmulatorHost();

        }

        emulatorUsed = true;

        gameStopped = false;

        if(activeBlobUrl){

            URL.revokeObjectURL(
                activeBlobUrl
            );

            activeBlobUrl =
                null;

        }


        const romURL =
            await createROMURL(
                game
            );


        activeBlobUrl =
            romURL;


        portFrame.hidden =
            true;


        portFrame.src =
            "about:blank";


        gameElement.hidden =
            false;


        player.classList.remove(
            "hidden"
        );


        /*
            EmulatorJS configuration.
        */

        window.EJS_player =
            "#game";


        window.EJS_core =
            game.system;


        window.EJS_gameName =
            game.key ||
            game.name;


        const gameId =
            hashId(
                game.system +
                ":" +
                game.name
            );


        window.EJS_gameID =
            gameId;


        window.EJS_gameUrl =
            romURL;


        window.EJS_pathtodata =
            CONFIG.emulatorData;


        window.EJS_startOnLoaded =
            true;


        window.EJS_color =
            "#7c5cff";


        window.EJS_askBeforeExit =
            false;


        window.EJS_threads =
            (
                game.system === "psp" ||
                game.system === "3ds"
            );


        /*
            Route EmulatorJS's own save states and in-game
            (SRAM) saves through the SELECT/Saves folder
            instead of browser storage or manual downloads.

            Each hook fully replaces the matching default
            behavior once it's registered - so these both
            handle the automatic case (silent autosave as
            you play) and the manual "Save State"/"Load
            State"/"Save File"/"Load File" buttons in
            EmulatorJS's own menu.
        */

        window.EJS_onGameStart =
            async () => {

                await loadEmulatorSaveOnStart(
                    gameId
                );

            };


        window.EJS_onSaveUpdate =
            async (data) => {

                await writeSaveFileBinary(
                    emulatorSaveFileName(gameId),
                    data.save
                );


                /*
                    Wake up anything waiting on
                    flushEmulatorSaveBeforeExit() (e.g. the
                    Back button), now that the write is done.
                */

                if(pendingAutosaveResolve){

                    pendingAutosaveResolve();

                    pendingAutosaveResolve =
                        null;

                }

            };


        /*
            Force EmulatorJS to flush the SRAM/battery save to
            disk on a fixed timer, regardless of whatever the
            player's own "save interval" setting is (this also
            hides that setting from the in-game menu so it can't
            be turned down or off). Each flush fires
            EJS_onSaveUpdate above, which is what actually
            autosaves to the Saves folder.
        */

        window.EJS_fixedSaveInterval =
            CONFIG.autosaveIntervalMs;


        /*
            EmulatorJS's own toolbar has its own "exit" button
            with no hook into our save-flushing logic. Hide it so
            the only way out is our "<- Back" button, which always
            flushes the save first (see leaveGame()).
        */

        window.EJS_Buttons =
            {
                exitEmulation:false
            };


        window.EJS_onSaveSave =
            async (data) => {

                await writeSaveFileBinary(
                    emulatorSaveFileName(gameId),
                    data.save
                );

            };


        window.EJS_onLoadSave =
            async () => {

                await loadEmulatorSaveOnStart(
                    gameId
                );

            };


        window.EJS_onSaveState =
            async (data) => {

                await writeSaveFileBinary(
                    emulatorStateFileName(gameId),
                    data.state
                );

            };


        window.EJS_onLoadState =
            async () => {

                const bytes =
                    await readSaveFileBinary(
                        emulatorStateFileName(gameId)
                    );


                if(
                    bytes &&
                    window.EJS_emulator &&
                    window.EJS_emulator.gameManager
                ){

                    window.EJS_emulator.gameManager
                        .loadState(bytes);

                }

            };


        /*
            Remove old EmulatorJS loader.
        */

        const oldLoader =
            document.getElementById(
                "emulatorjs-loader"
            );


        if(oldLoader){
            oldLoader.remove();
        }


        /*
            Load EmulatorJS.
        */

        const script =
            document.createElement(
                "script"
            );


        script.id =
            "emulatorjs-loader";


        script.src =
            CONFIG.emulatorData +
            "loader.js";


        script.onerror = () => {

            alert(
                "EmulatorJS could not be loaded.\n\n" +
                "Check your internet connection."
            );

        };


        document.body.appendChild(
            script
        );

    }catch(error){

        console.error(error);


        alert(
            "Could not start game:\n\n" +
            error.message
        );

    }

}


/* =========================================================
   GET PORT FILE
========================================================= */

async function getPortFile(port){

    if(portsDirectory){

        return await getFileFromPath(

            portsDirectory,

            port.path

        );

    }


    if(port.fallbackFile){

        return port.fallbackFile;

    }


    throw new Error(
        "Could not access port file."
    );

}


/* =========================================================
   PLAY PORT
========================================================= */

async function playPort(port){

    try{

        gameStopped = false;

        if(activeBlobUrl){

            URL.revokeObjectURL(
                activeBlobUrl
            );

            activeBlobUrl =
                null;

        }


        const file =
            await getPortFile(
                port
            );


        const extension =
            getExtension(
                file.name
            );


        /*
            Normal HTML.
        */

        if(
            extension === "html" ||
            extension === "htm"
        ){

            activeBlobUrl =
                URL.createObjectURL(
                    file
                );


            portFrame.src =
                activeBlobUrl;

        }


        /*
            Base64 HTML.
        */

        else if(
            extension === "b64"
        ){

            const text =
                await file.text();


            let decoded;


            try{

                decoded =
                    atob(
                        text.replace(
                            /\s/g,
                            ""
                        )
                    );

            }catch(error){

                throw new Error(
                    "This .b64 file is not valid Base64."
                );

            }


            const bytes =
                new Uint8Array(
                    decoded.length
                );


            for(
                let i=0;
                i<decoded.length;
                i++
            ){

                bytes[i] =
                    decoded.charCodeAt(i);

            }


            const htmlBlob =
                new Blob(
                    [bytes],
                    {
                        type:"text/html"
                    }
                );


            activeBlobUrl =
                URL.createObjectURL(
                    htmlBlob
                );


            portFrame.src =
                activeBlobUrl;

        }


        gameElement.hidden =
            true;


        portFrame.hidden =
            false;


        player.classList.remove(
            "hidden"
        );

    }catch(error){

        console.error(error);


        alert(
            "Could not start port:\n\n" +
            error.message
        );

    }

}


/* =========================================================
   LEAVE GAME
========================================================= */

/*
    Really stops whatever is running - not just hides it.

    - Ports: the iframe is navigated to about:blank and removed
      from the page, which destroys its window, scripts, timers
      and audio.
    - Emulators: the core's main loop is stopped, every
      AudioContext and Worker the page created is closed /
      terminated, and the game element is emptied.
*/

let gameStopped = false;

let emulatorUsed = false;

function stopRunningGame(){

    gameStopped = true;


    /* ---- Port iframe ---- */

    try{

        portFrame.hidden = true;

        portFrame.src = "about:blank";

        if(portFrame.contentWindow){

            try{
                portFrame.contentWindow.stop();
            }catch(error){}

        }

    }catch(error){

        console.warn("Could not stop port frame:", error);

    }

    if(activeBlobUrl){

        URL.revokeObjectURL(activeBlobUrl);

        activeBlobUrl = null;

    }


    /* ---- Emulator ---- */

    const emulator = window.EJS_emulator;

    if(emulator){

        try{

            if(typeof emulator.pause === "function"){
                emulator.pause(true);
            }

        }catch(error){}

        try{

            if(
                emulator.gameManager &&
                typeof emulator.gameManager.toggleMainLoop === "function"
            ){
                emulator.gameManager.toggleMainLoop(0);
            }

        }catch(error){}

    }

    for(const context of trackedAudioContexts){

        try{
            context.close();
        }catch(error){}

    }

    trackedAudioContexts.clear();

    for(const worker of trackedWorkers){

        try{
            worker.terminate();
        }catch(error){}

    }

    trackedWorkers.clear();

    try{

        gameElement.innerHTML = "";

        gameElement.hidden = true;

    }catch(error){}

    const oldLoader = document.getElementById("emulatorjs-loader");

    if(oldLoader){
        oldLoader.remove();
    }

    window.EJS_emulator = null;

}

/*
    Gets the emulator host back to a clean state so another
    game can be started without reloading the page (only used
    when the page couldn't reload itself - see leaveGame()).
*/
function resetEmulatorHost(){

    const fresh = document.createElement("div");

    fresh.id = "game";

    gameElement.replaceWith(fresh);

    gameElement = fresh;

    delete window.EJS_emulator;

    gameStopped = false;

}

let leaving = false;

async function leaveGame(){

    if(leaving){
        return;
    }

    leaving = true;


    /*
        Give EmulatorJS a chance to write out the latest save
        before everything is shut down - otherwise whatever
        changed since the last autosave tick is lost. No-ops
        instantly for ports (no EJS_emulator) or if nothing
        has changed since the last save.
    */

    try{
        await flushEmulatorSaveBeforeExit();
    }catch(error){
        console.warn("Save flush failed:", error);
    }


    /*
        Shut the game down right now, whatever happens next.
    */

    stopRunningGame();

    player.classList.add("hidden");


    /*
        Reloading gives a completely fresh page. Some setups
        (for example a file:// page in a locked-down frame)
        block the reload, so don't depend on it: if we're
        still here shortly afterwards, carry on in place with
        the game already stopped.
    */

    try{
        location.reload();
    }catch(error){
        console.warn("Reload blocked:", error);
    }

    setTimeout(
        () => {

            leaving = false;

            render();

        },
        1500
    );

}

/* =========================================================
   KEYBOARD SEARCH
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "/" &&
            document.activeElement !==
            searchElement
        ){

            event.preventDefault();

            searchElement.focus();

        }


        if(
            event.key === "Escape" &&
            document.activeElement ===
            searchElement
        ){

            searchElement.value = "";

            render();

            searchElement.blur();

        }

    }
);

/*
    Best-effort safety net for the cases leaveGame() can't cover -
    the tab being backgrounded, closed, or navigated away from
    directly instead of via the Back button. This can't guarantee
    the write finishes (the page may already be gone), but it gives
    it the best chance by triggering the flush as early as possible
    rather than waiting for the next fixed-interval tick.
*/

function triggerBestEffortSave(){

    if(gameStopped){
        return;
    }

    const emulator =
        window.EJS_emulator;


    if(
        emulator &&
        emulator.gameManager &&
        typeof emulator.gameManager.saveSaveFiles ===
            "function"
    ){

        try{
            emulator.gameManager.saveSaveFiles();
        }catch(error){}

    }

}


document.addEventListener(
    "visibilitychange",
    () => {

        if(document.hidden){

            triggerBestEffortSave();

        }

    }
);


window.addEventListener(
    "pagehide",
    triggerBestEffortSave
);
