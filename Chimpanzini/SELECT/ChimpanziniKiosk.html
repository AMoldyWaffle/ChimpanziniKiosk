<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHIMPANZINI KIOSK — Online Library</title>
<style>
:root{--bg:#0b0d10;--panel:#12151b;--panel2:#181c23;--border:#282e38;--text:#f2f4f7;--muted:#8d96a5;--accent:#7c5cff;--accent2:#987dff;--danger:#ff5c5c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:18px 24px;background:rgba(11,13,16,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.logo{font-size:21px;font-weight:800;white-space:nowrap}.searchWrap{flex:1;max-width:650px;margin:auto}.search{width:100%;padding:11px 15px;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;outline:none}.search:focus{border-color:var(--accent)}
.btn{padding:10px 14px;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:7px}.btn:hover{background:var(--panel2);border-color:#3a414d}.btn.primary{background:var(--accent);border-color:var(--accent)}
main{width:min(1400px,calc(100% - 40px));margin:auto;padding:28px 0 60px}.status{margin-bottom:20px;padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:14px}.status strong{color:var(--text)}
.sectionTitle{margin:30px 0 13px;color:var(--muted);font-size:18px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.card{min-height:100px;padding:15px;color:var(--text);text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:9px;transition:transform .12s,background .12s,border-color .12s}.card:hover{transform:translateY(-2px);background:var(--panel2);border-color:#3b424e}.cardTitle{font-weight:700;line-height:1.3}.cardActions{display:flex;gap:8px;margin-top:12px}.downloadBtn{padding:7px 10px;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:6px;font-size:12px}.downloadBtn:hover{border-color:var(--accent);background:var(--panel)}.cardMeta{margin-top:8px;color:var(--muted);font-size:12px}.empty{padding:30px;color:var(--muted);text-align:center;background:var(--panel);border:1px dashed var(--border);border-radius:9px}
#player{position:fixed;inset:0;z-index:100;background:#000}#player.hidden{display:none}#game{position:absolute;inset:0;width:100%;height:100%}#portFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}.playerBar{position:absolute;top:15px;left:15px;z-index:10;display:flex;gap:8px}.playerButton{padding:9px 13px;color:#fff;background:rgba(20,20,25,.88);border:1px solid #3a3a44;border-radius:7px}.playerButton:hover{background:rgba(40,40,48,.95)}
.progress{display:inline-block;margin-left:8px}.warn{color:#ffd36a}.error{color:#ff7b7b}@media(max-width:800px){header{flex-wrap:wrap}.logo{width:100%}.searchWrap{order:3;width:100%;max-width:none}main{width:min(100% - 24px,1400px)}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}

</head>
<body>
<header>
  <div class="logo">CHIMPANZINI KIOSK</div>
  <div class="searchWrap"><input id="search" class="search" type="search" placeholder="Search online games..." autocomplete="off"></div>
  <button id="localButton" class="btn">Use Local SELECT</button>
  <button id="refreshButton" class="btn primary">Refresh Online Library</button>
  <button id="downloadFolderButton" class="btn">Reconnect SELECT</button>
</header>
<main>
  <div id="status" class="status"><strong>Loading ChimpanziniKiosk...</strong> Reading ROMs and HTML Ports from GitHub; EmulatorJS runs online.</div>
  <section><div class="sectionTitle">ROM Games</div><div id="gamesGrid" class="grid"></div></section>
  <section id="portsSection" hidden><div class="sectionTitle">Ports</div><div id="portsGrid" class="grid"></div></section>
</main>
<div id="player" class="hidden">
  <div class="playerBar"><button id="backButton" class="playerButton">← Back</button></div>
  <div id="game"></div>
  <iframe id="portFrame" hidden allow="autoplay; fullscreen; gamepad"></iframe>
</div>
<script>
"use strict";

const REPO = "AMoldyWaffle/ChimpanziniKiosk";
const BRANCH = "main";
const CDN_ROOT = `https://cdn.jsdelivr.net/gh/${REPO}@${BRANCH}/`;
const RAW_ROOT = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/`;
const EMULATOR_DATA_CANDIDATES = [
  "https://cdn.jsdelivr.net/gh/AMoldyWaffle/RetroEmulator@main/",
  "https://raw.githubusercontent.com/AMoldyWaffle/RetroEmulator/main/"
];
let EMULATOR_DATA = EMULATOR_DATA_CANDIDATES[0];

const SYSTEMS = {
  nes:{name:"NES",extensions:["nes"]}, snes:{name:"SNES",extensions:["sfc","smc"]}, n64:{name:"Nintendo 64",extensions:["n64","z64","v64"]},
  gb:{name:"Game Boy",extensions:["gb"]}, gbc:{name:"Game Boy Color",extensions:["gbc"]}, gba:{name:"Game Boy Advance",extensions:["gba"]},
  nds:{name:"Nintendo DS",extensions:["nds"]}, genesis:{name:"Sega Genesis",extensions:["gen","md"]}, sms:{name:"Sega Master System",extensions:["sms"]},
  gg:{name:"Game Gear",extensions:["gg"]}, psx:{name:"PlayStation",extensions:["bin","cue","iso","chd","img"]}, psp:{name:"PSP",extensions:["iso","cso"]},
  pce:{name:"PC Engine",extensions:["pce"]}, atari2600:{name:"Atari 2600",extensions:["a26"]}, atari5200:{name:"Atari 5200",extensions:["a52"]},
  atari7800:{name:"Atari 7800",extensions:["a78"]}, lynx:{name:"Atari Lynx",extensions:["lnx"]}, jaguar:{name:"Atari Jaguar",extensions:["j64","jag"]},
  wonderswan:{name:"WonderSwan",extensions:["ws"]}, wonderswancolor:{name:"WonderSwan Color",extensions:["wsc"]}, ngp:{name:"Neo Geo Pocket",extensions:["ngp"]},
  ngpc:{name:"Neo Geo Pocket Color",extensions:["ngc"]}, virtualboy:{name:"Virtual Boy",extensions:["vb"]}, coleco:{name:"ColecoVision",extensions:["col"]},
  c64:{name:"Commodore 64",extensions:["d64","crt","prg"]}, amiga:{name:"Amiga",extensions:["adf"]}, "3ds":{name:"Nintendo 3DS",extensions:["3ds","cia"]}
};

const statusElement=document.getElementById("status"), gamesGrid=document.getElementById("gamesGrid"), portsGrid=document.getElementById("portsGrid"), portsSection=document.getElementById("portsSection"), search=document.getElementById("search"), player=document.getElementById("player"), gameElement=document.getElementById("game"), portFrame=document.getElementById("portFrame");
let games=[],ports=[],activeBlobUrl=null,manifest=[];

function escapeHTML(x){return String(x).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function ext(name){const p=name.toLowerCase().split(".");return p.length>1?p.pop():""}
function cleanTitle(name){return name.replace(/\.[^.]+$/i,"").replace(/[_-]+/g," ").trim()}
function guessSystem(fileName,path=""){
  const e=ext(fileName), p=path.toLowerCase();
  if(/gba|game boy advance/.test(p))return "gba"; if(/gbc|game boy color/.test(p))return "gbc"; if(/n64|nintendo 64/.test(p))return "n64";
  if(/snes|super nintendo/.test(p))return "snes"; if(/nes|nintendo entertainment/.test(p))return "nes"; if(/ps1|psx|playstation/.test(p))return "psx"; if(/psp/.test(p))return "psp"; if(/3ds/.test(p))return "3ds";
  for(const [id,s] of Object.entries(SYSTEMS))if(s.extensions.includes(e))return id;
  return null;
}
function fileNameOf(x){return x.name.split("/").pop()}
function isPort(path){return /\.html?$/i.test(path)}
function isRom(path){return !!guessSystem(fileNameOf({name:path}),path)}

function splitInfo(path){
  const name=fileNameOf({name:path});
  let m=name.match(/^(.*?)(?:[_ .-]?part[_ .-]?)(\d{1,3})(\.[^.]+)$/i);
  if(m)return {key:path.slice(0,path.length-name.length)+m[1].toLowerCase(),num:+m[2],extension:m[3].slice(1).toLowerCase(),name,style:"part"};
  m=name.match(/^(.*?)(?:\.)(\d{3})$/);
  if(m)return {key:path.slice(0,path.length-name.length)+m[1].toLowerCase(),num:+m[2],extension:"",name,style:"numeric"};
  return null;
}

function buildLibraries(files){
  const romFiles=files.filter(x=>/^\/ROMs\//i.test(x.name) && !x.name.endsWith("/"));
  const portFiles=files.filter(x=>/^\/Ports\//i.test(x.name) && !x.name.endsWith("/"));
  const rootGames=[], folderGroups=new Map();
  for(const f of romFiles){
    const clean=f.name.replace(/^\//,""), relative=clean.replace(/^ROMs\//i,""), slash=relative.indexOf("/");
    if(slash===-1){rootGames.push({type:"rom",name:cleanTitle(fileNameOf(f)),path:clean,system:null,parts:null,size:f.size||0,url:CDN_ROOT+encodePath(clean)});continue;}
    const folder=relative.slice(0,slash);
    if(!folderGroups.has(folder))folderGroups.set(folder,[]);
    folderGroups.get(folder).push({...f,relative});
  }
  const result=[...rootGames];
  for(const [folder,parts] of folderGroups){
    parts.sort((a,b)=>a.relative.localeCompare(b.relative,undefined,{numeric:true,sensitivity:"base"}));
    const splitParts=parts.filter(p=>splitInfo(p.name));
    if(splitParts.length>=2){
      const ordered=splitParts.slice().sort((a,b)=>splitInfo(a.name).num-splitInfo(b.name).num);
      const last=ordered[ordered.length-1];
      const inferredExt=ordered.map(p=>splitInfo(p.name).extension).find(e=>e&&e!=="isopart")||ext(last.name)||"iso";
      result.push({type:"rom",name:folder,path:`ROMs/${folder}`,system:null,parts:ordered.map(p=>p.name.replace(/^\//,"")),virtualName:`${folder}.${inferredExt}`,size:ordered.reduce((n,p)=>n+(p.size||0),0)});
    }else{
      const chosen=parts.find(p=>guessSystem(fileNameOf(p),p.name))||parts[0];
      const path=chosen.name.replace(/^\//,"");
      result.push({type:"rom",name:folder,path,system:null,parts:null,size:chosen.size||0,url:CDN_ROOT+encodePath(path),folder:`ROMs/${folder}`});
    }
  }

  const normalPorts=[], splitGroups=new Map();
  for(const f of portFiles){
    const name=fileNameOf(f), prefix=f.name.slice(0,f.name.length-name.length);
    let m=name.match(/^(.*?)(?:[_ .-]?part[_ .-]?)(\d{1,3})(\.html?)$/i);
    let key, num, outputName;
    if(m){key=(prefix+m[1]).toLowerCase();num=+m[2];outputName=m[1]+m[3];}
    else if((m=name.match(/^(.*?\.html?)[_ .-]?part[_ .-]?(\d{1,3})$/i))){key=(prefix+m[1]).toLowerCase();num=+m[2];outputName=m[1];}
    else if((m=name.match(/^(.*?)(?:\.)(\d{3})$/))){key=(prefix+m[1]+".html").toLowerCase();num=+m[2];outputName=m[1]+".html";}
    else {if(isPort(f.name))normalPorts.push(f);continue;}
    if(!splitGroups.has(key))splitGroups.set(key,{outputName,files:[]});
    splitGroups.get(key).files.push({file:f,num});
  }
  const p=normalPorts.map(f=>{const path=f.name.replace(/^\//,"");return {type:"port",name:cleanTitle(fileNameOf(f)),path,size:f.size||0,url:CDN_ROOT+encodePath(path),rawUrl:RAW_ROOT+encodePath(path),parts:null};});
  for(const group of splitGroups.values()){
    if(group.files.length<2)continue;
    group.files.sort((a,b)=>a.num-b.num);
    const path=group.files[0].file.name.replace(/^\//,"");
    p.push({type:"port",name:cleanTitle(group.outputName.replace(/\.html?$/i,"")),path,outputName:group.outputName,size:group.files.reduce((n,x)=>n+(x.file.size||0),0),parts:group.files.map(x=>x.file.name.replace(/^\//,"")),url:null,rawUrl:null});
  }
  return {games:result,ports:p};
}

function resolveGameSystem(g){
  if(g.system && SYSTEMS[g.system])return g.system;
  const candidates=[];
  if(g.virtualName)candidates.push(g.virtualName);
  if(g.path)candidates.push(g.path);
  if(g.name)candidates.push(g.name);
  for(const c of candidates){
    const found=guessSystem(fileNameOf({name:c}),c);
    if(found)return found;
  }
  // Split optical-disc images whose individual pieces are .bin are most
  // commonly PlayStation images in this library.
  if(g.parts && g.parts.length && g.parts.every(p=>/\.(?:bin|isopart)$/i.test(p)))return "psx";
  return null;
}
function encodePath(path){return path.split("/").map(encodeURIComponent).join("/")}

async function githubContents(path){
  const url=`https://api.github.com/repos/${REPO}/contents/${path.split('/').map(encodeURIComponent).join('/') }?ref=${encodeURIComponent(BRANCH)}`;
  const r=await fetch(url,{cache:"no-store",headers:{Accept:"application/vnd.github+json"}});
  if(!r.ok)throw new Error(`GitHub folder request failed (${r.status}) for ${path||"repository root"}.`);
  const data=await r.json();
  if(!Array.isArray(data))throw new Error(`GitHub returned an invalid folder listing for ${path||"repository root"}.`);
  return data;
}

async function loadGitHubFolder(path, out){
  const entries=await githubContents(path);
  for(const entry of entries){
    if(entry.type==="file"){
      out.push({name:"/"+entry.path,size:entry.size||0});
    }else if(entry.type==="dir"){
      await loadGitHubFolder(entry.path,out);
    }
  }
}

async function loadGitHubTree(){
  // Discover ROMs/Ports with the GitHub Contents API instead of the recursive
  // Git tree endpoint. The recursive tree can be truncated for large repos,
  // which can make a successful connection appear to contain zero ROMs.
  const out=[];
  await loadGitHubFolder("ROMs",out);
  await loadGitHubFolder("Ports",out);
  return out;
}

async function loadManifest(){
  statusElement.innerHTML='<strong>Loading online library...</strong> Reading the repository file list.';
  const allFiles=await loadGitHubTree();
  manifest=allFiles.filter(x=>/^\/(?:ROMs|Ports)\//i.test(x.name));
  const lib=buildLibraries(manifest); games=lib.games; ports=lib.ports;
  statusElement.innerHTML=`<strong>Online library connected.</strong> ${games.length} ROM game${games.length===1?"":"s"} and ${ports.length} port${ports.length===1?"":"s"} found in <b>ROMs</b> and <b>Ports</b>.`;
  render();
}

function render(){
  const q=search.value.trim().toLowerCase();
  gamesGrid.innerHTML="";
  const filtered=games.filter(g=>!q || (g.name+" "+g.path+" "+(SYSTEMS[resolveGameSystem(g)]?.name||resolveGameSystem(g)||"")).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  if(!filtered.length)gamesGrid.innerHTML='<div class="empty">No online ROM games found.</div>';
  for(const g of filtered){
    const c=document.createElement("div"); c.className="card";
    const system=resolveGameSystem(g);
    c.innerHTML=`<div class="cardTitle">${escapeHTML(g.name)}</div><div class="cardMeta">${escapeHTML(SYSTEMS[system]?.name||system||"ROM")} · ${formatBytes(g.size||0)}${g.parts?` · ${g.parts.length} parts`:""}</div><div class="cardActions"><button class="downloadBtn" type="button">Download</button></div>`;
    c.onclick=()=>playGame(g);
    c.querySelector(".downloadBtn").onclick=(event)=>{event.stopPropagation();downloadGame(g,event.currentTarget)};
    gamesGrid.appendChild(c);
  }
  portsSection.hidden=!ports.length;
  portsGrid.innerHTML="";
  const fp=ports.filter(p=>!q||(p.name+" "+p.path).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  for(const p of fp){
    const c=document.createElement("div"); c.className="card";
    c.innerHTML=`<div class="cardTitle">${escapeHTML(p.name)}</div><div class="cardMeta">Port · ${formatBytes(p.size||0)}${p.parts?` · ${p.parts.length} parts`:""}</div><div class="cardActions"><button class="downloadBtn" type="button">Download</button></div>`;
    c.onclick=()=>playPort(p);
    c.querySelector(".downloadBtn").onclick=(event)=>{event.stopPropagation();downloadPort(p,event.currentTarget)};
    portsGrid.appendChild(c);
  }
}

/* =========================================================
   SHARED SELECT FOLDER HANDLER
   Reuses the exact handler saved by ../index.html.
========================================================= */
const HANDLE_DB_NAME = "gooncave-launcher";
const HANDLE_STORE = "handles";
const HANDLE_KEY = "selectFolder";
let selectDirectory = null;

function openHandleDB(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(HANDLE_DB_NAME,1);
    request.onerror=()=>reject(request.error||new Error("Could not open launcher storage."));
    request.onsuccess=()=>resolve(request.result);
  });
}

async function getRememberedSelectFolder(){
  const db=await openHandleDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(HANDLE_STORE,"readonly");
    const request=tx.objectStore(HANDLE_STORE).get(HANDLE_KEY);
    request.onsuccess=()=>resolve(request.result||null);
    request.onerror=()=>reject(request.error||new Error("Could not read the saved SELECT folder."));
  });
}

async function restoreSelectFolder(){
  try{
    const handle=await getRememberedSelectFolder();
    if(!handle) return false;

    const permission=await handle.queryPermission({mode:"readwrite"});
    if(permission==="granted"){
      selectDirectory=handle;
      updateDownloadStatus();
      return true;
    }

    updateDownloadStatus(false);
    return false;
  }catch(error){
    console.warn("Could not restore SELECT handler:",error);
    updateDownloadStatus(false);
    return false;
  }
}

function updateDownloadStatus(connected=!!selectDirectory){
  const button=document.getElementById("downloadFolderButton");
  if(!button)return;
  button.textContent=connected?"SELECT Connected":"Reconnect SELECT";
  button.classList.toggle("primary",connected);
}

async function ensureSelectFolder(){
  if(selectDirectory){
    const permission=await selectDirectory.queryPermission({mode:"readwrite"});
    if(permission==="granted") return selectDirectory;
  }

  const remembered=await getRememberedSelectFolder();
  if(!remembered){
    throw new Error("No SELECT folder is connected. Open the local launcher, choose your SELECT folder, then return to the Kiosk.");
  }

  let permission=await remembered.queryPermission({mode:"readwrite"});
  if(permission!=="granted"){
    permission=await remembered.requestPermission({mode:"readwrite"});
  }

  if(permission!=="granted"){
    throw new Error("Browser permission for the saved SELECT folder was not granted.");
  }

  selectDirectory=remembered;
  updateDownloadStatus();
  return selectDirectory;
}

async function getDownloadDirectory(kind){
  const root=await ensureSelectFolder();
  return root.getDirectoryHandle(kind==="port"?"Ports":"ROMs",{create:true});
}

async function writeBlobToDirectory(directory,fileName,blob){
  const safeName=fileName.replace(/[\\/:*?"<>|]/g,"_");
  const fileHandle=await directory.getFileHandle(safeName,{create:true});
  const writable=await fileHandle.createWritable();
  try{
    await writable.write(blob);
    await writable.close();
  }catch(error){
    try{await writable.abort();}catch(_){ }
    throw error;
  }
}

async function fetchDownloadBlob(urls){
  let lastError=null;
  for(const url of urls.filter(Boolean)){
    try{
      const response=await fetch(url,{cache:"no-store"});
      if(response.ok) return await response.blob();
      lastError=new Error(`HTTP ${response.status}`);
    }catch(error){
      lastError=error;
    }
  }
  throw lastError||new Error("Download request failed.");
}

async function getGameDownloadBlob(game){
  if(game.parts?.length){
    const ordered=game.parts.slice().sort((a,b)=>{
      const na=splitInfo(a)?.num ?? 0;
      const nb=splitInfo(b)?.num ?? 0;
      return na-nb;
    });
    const blobs=[];
    for(const part of ordered){
      const path=part.replace(/^\//,"");
      blobs.push(await fetchDownloadBlob([
        CDN_ROOT+encodePath(path),
        RAW_ROOT+encodePath(path)
      ]));
    }
    return new Blob(blobs,{type:"application/octet-stream"});
  }

  const path=game.path.replace(/^\//,"");
  return fetchDownloadBlob([
    game.url,
    CDN_ROOT+encodePath(path),
    RAW_ROOT+encodePath(path)
  ]);
}

function gameDownloadName(game){
  if(game.virtualName) return game.virtualName;
  const original=fileNameOf({name:game.path||game.name});
  return original || `${game.name}.rom`;
}

async function downloadGame(game,button){
  const old=button.textContent;
  try{
    button.disabled=true;
    button.textContent=game.parts?"Combining...":"Downloading...";
    const blob=await getGameDownloadBlob(game);
    const directory=await getDownloadDirectory("rom");
    await writeBlobToDirectory(directory,gameDownloadName(game),blob);
    button.textContent="Saved ✓";
  }catch(error){
    console.error("ROM download failed:",error);
    button.textContent="Failed";
    alert("Could not save ROM:\n\n"+error.message);
  }finally{
    setTimeout(()=>{button.disabled=false;button.textContent=old},1500);
  }
}

async function downloadPort(port,button){
  const old=button.textContent;
  try{
    button.disabled=true;
    button.textContent="Downloading...";
    if(port.parts?.length && port.parts.length > 40){
      throw new Error(`This port has ${port.parts.length} parts. Split ports are limited to 40 parts.`);
    }
    const blob=port.parts?.length ? await fetchParts(port.parts) : await fetchDownloadBlob([port.url,port.rawUrl]);
    const directory=await getDownloadDirectory("port");
    const fileName=port.outputName || fileNameOf({name:port.path}) || `${port.name}.html`;
    await writeBlobToDirectory(directory,fileName,blob);
    button.textContent="Saved ✓";
  }catch(error){
    console.error("Port download failed:",error);
    button.textContent="Failed";
    alert("Could not save port:\n\n"+error.message);
  }finally{
    setTimeout(()=>{button.disabled=false;button.textContent=old},1500);
  }
}

async function reconnectSelectFromKiosk(){
  try{
    const handle=await getRememberedSelectFolder();
    if(!handle){
      alert("No saved SELECT folder was found. Go back to the local launcher and choose your SELECT folder first.");
      return;
    }
    const permission=await handle.requestPermission({mode:"readwrite"});
    if(permission!=="granted"){
      updateDownloadStatus(false);
      alert("SELECT folder permission was not granted.");
      return;
    }
    selectDirectory=handle;
    updateDownloadStatus();
  }catch(error){
    console.error("Could not reconnect SELECT:",error);
    alert("Could not reconnect SELECT:\n\n"+error.message);
  }
}

async function fetchParts(parts){
  if(!parts?.length) throw new Error("No ROM parts were provided.");

  const total = parts.length;
  const label = escapeHTML(cleanTitle(fileNameOf({name:parts[0]})));

  // A controlled pool is faster and more reliable than firing 40 requests
  // at once. It avoids browser/CDN connection throttling while keeping the
  // network busy continuously.
  const CONCURRENCY = Math.min(8, total);

  const buffers = new Array(total);
  let next = 0;
  let completed = 0;
  let totalBytes = 0;

  statusElement.innerHTML =
    `<strong>Loading ${label}</strong> ` +
    `<span class="progress">0/${total} parts · ${CONCURRENCY} downloads at once...</span>`;

  const worker = async () => {
    while(true){
      const index = next++;
      if(index >= total) return;

      const part = parts[index];
      const cdnUrl = CDN_ROOT + encodePath(part);
      const rawUrl =
        `https://raw.githubusercontent.com/${REPO}/${BRANCH}/` +
        encodePath(part);

      let response = null;
      let usedFallback = false;
      let lastError = null;

      // Try jsDelivr first. If it returns a CDN error such as 403/429,
      // immediately fall back to GitHub's raw file host for that part.
      const urls = [cdnUrl, rawUrl];

      for(const candidateUrl of urls){
        for(let attempt=1; attempt<=3; attempt++){
          try{
            response = await fetch(candidateUrl, {
              cache:"no-store"
            });

            if(response.ok){
              usedFallback = candidateUrl === rawUrl;
              break;
            }

            lastError = new Error(`HTTP ${response.status}`);
          }catch(error){
            lastError = error;
          }

          if(attempt < 3){
            await new Promise(resolve =>
              setTimeout(resolve, 250 * attempt)
            );
          }
        }

        if(response?.ok) break;
      }

      if(!response?.ok){
        throw new Error(
          `Could not download part ${index+1} (${part}): ` +
          `${lastError?.message || "request failed"}`
        );
      }

      buffers[index] = await response.arrayBuffer();

      if(usedFallback){
        console.warn(`Part ${index+1} used GitHub raw fallback: ${part}`);
      }
      totalBytes += buffers[index].byteLength;
      completed++;

      statusElement.innerHTML =
        `<strong>Loading ${label}</strong> ` +
        `<span class="progress">` +
        `${completed}/${total} parts · ${formatBytes(totalBytes)} downloaded` +
        `</span>`;
    }
  };

  await Promise.all(
    Array.from(
      {length:CONCURRENCY},
      () => worker()
    )
  );

  statusElement.innerHTML =
    `<strong>Loading ${label}</strong> ` +
    `<span class="progress">All ${total} parts downloaded · assembling...</span>`;

  // The array is already in the correct numerical order.
  return new Blob(
    buffers,
    {type:"application/octet-stream"}
  );
}

function formatBytes(bytes){
  if(bytes < 1024 * 1024){
    return `${(bytes / 1024).toFixed(0)} KB`;
  }

  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

async function loadEmulatorJS(){
  if(document.getElementById("emulatorjs-online-loader")){
    return;
  }

  let lastError = null;

  for(const dataRoot of EMULATOR_DATA_CANDIDATES){
    const script = document.createElement("script");
    script.id = "emulatorjs-online-loader";
    script.src = dataRoot + "loader.js";

    try{
      await new Promise((resolve,reject) => {
        script.onload = resolve;
        script.onerror = () => reject(
          new Error(`Could not load ${dataRoot}loader.js`)
        );
        document.body.appendChild(script);
      });

      // The loader uses EJS_pathtodata, so keep it matched to the
      // host from which loader.js was successfully loaded.
      EMULATOR_DATA = dataRoot;
      return;
    }catch(error){
      lastError = error;
      script.remove();
    }
  }

  throw new Error(
    `Online EmulatorJS could not be loaded from any configured CDN. ` +
    `${lastError?.message || "All CDN requests failed."}`
  );
}

async function playGame(g){
  try{
    if(activeBlobUrl){URL.revokeObjectURL(activeBlobUrl);activeBlobUrl=null}
    const romBlob=g.parts?await fetchParts(g.parts):await (await fetch(g.url)).blob();
    activeBlobUrl=URL.createObjectURL(romBlob);
    gameElement.hidden=false;portFrame.hidden=true;portFrame.src="about:blank";player.classList.remove("hidden");
    const system=resolveGameSystem(g); if(!system)throw new Error("Could not determine an EmulatorJS core for "+g.name+". The ROM is visible, but its system needs to be identified."); window.EJS_player="#game";window.EJS_core=system;window.EJS_gameName=g.name;window.EJS_gameID=btoa(unescape(encodeURIComponent(g.path))).replace(/[^a-zA-Z0-9]/g,"").slice(0,40);window.EJS_gameUrl=activeBlobUrl;window.EJS_pathtodata=EMULATOR_DATA;window.EJS_startOnLoaded=true;window.EJS_askBeforeExit=false;
    await loadEmulatorJS();
  }catch(e){console.error(e);alert("Could not start game:\n\n"+e.message)}
}

async function playPort(p){
  if(activeBlobUrl){
    URL.revokeObjectURL(activeBlobUrl);
    activeBlobUrl = null;
  }

  gameElement.hidden = true;
  portFrame.hidden = false;
  player.classList.remove("hidden");

  // Split ports use piece filenames such as Game.part01.html,
  // Game.html.part01, or Game.001. They are assembled into one HTML
  // document before launch, so only normal (non-split) ports need the
  // .html filename check.
  if(!p.parts?.length && !/\.html?$/i.test(p.path)){
    alert("This port is not an HTML file.");
    portFrame.hidden = true;
    return;
  }

  /*
      jsDelivr rejects files above its size limit with HTTP 403.

      Small HTML ports can be opened directly from jsDelivr. For a large
      HTML port, download the source from GitHub's raw server instead and
      turn it into a Blob URL.

      A <base> element is injected into the large port so relative files
      continue to resolve from the original GitHub Ports/ directory.
  */
  const JSDELIVR_LIMIT = 20 * 1024 * 1024;

  try{
    if(!p.parts?.length && (p.size || 0) <= JSDELIVR_LIMIT){
      portFrame.src = p.url;
      return;
    }

    let html;
    if(p.parts?.length){
      if(p.parts.length > 40){
        throw new Error(`This port has ${p.parts.length} parts. Split ports are limited to 40 parts.`);
      }
      statusElement.innerHTML = `<strong>Loading split port...</strong> ${escapeHTML(p.name)} <span class="progress">Downloading ${p.parts.length}/40 parts...</span>`;
      html = await (await fetchParts(p.parts)).text();
    }else{
      statusElement.innerHTML = `<strong>Loading large port...</strong> ${escapeHTML(p.name)} <span class="progress">(GitHub raw fallback)</span>`;
      const response = await fetch(p.rawUrl,{cache:"no-store"});
      if(!response.ok) throw new Error(`GitHub raw request failed (${response.status}) for ${p.name}.`);
      html = await response.text();
    }

    /*
        Make every relative URL in the HTML resolve against the port's
        original GitHub directory after the HTML becomes a Blob.

        Split ports intentionally have rawUrl === null because there is
        no single source file URL. Use the first split piece instead.
    */
    const basePath = p.parts?.length ? p.parts[0] : p.path;
    const baseRawUrl = RAW_ROOT + encodePath(basePath.replace(/^\//,""));
    const slash = baseRawUrl.lastIndexOf("/");
    const baseURL = baseRawUrl.slice(0, slash + 1);

    const baseTag = `<base href="${baseURL.replace(/"/g, "&quot;")}">`;

    if(/<head\b[^>]*>/i.test(html)){
      html = html.replace(
        /<head\b[^>]*>/i,
        match => match + baseTag
      );
    }else{
      html = baseTag + html;
    }

    const blob = new Blob(
      [html],
      {type:"text/html"}
    );

    activeBlobUrl = URL.createObjectURL(blob);
    portFrame.src = activeBlobUrl;

  }catch(error){
    console.error("Could not start port:", error);

    portFrame.hidden = true;

    alert(
      "Could not start port:\n\n" +
      error.message
    );
  }
}

function leave(){if(activeBlobUrl){URL.revokeObjectURL(activeBlobUrl);activeBlobUrl=null}player.classList.add("hidden");portFrame.src="about:blank";gameElement.innerHTML="";const l=document.getElementById("emulatorjs-online-loader");if(l)l.remove()}
